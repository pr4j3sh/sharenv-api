name: sharenv

services:
  api:
    image: pr4j3sh/sharenv-api:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - encryption_keys
    networks:
      - sharenv

  nginx:
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - sharenv

networks:
  sharenv:
    ipam:
      driver: default
      config:
        - subnet: 10.254.98.0/24

secrets:
  encryption_keys:
    file: ./deploy/secrets/encryption_keys.json
